<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Start Page">
    <meta name="author" content="Dan Lee">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <title id="title">Start Page</title>
</head>

<body onload="currentTime()">
    <div class="bg">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
    </div>
    <div class="wave-container">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.02)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.015)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.01)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(255,255,255,0.04)" />
            </g>
        </svg>
    </div>
    <div class="center">
        <div id="time" class="clock"></div>
        <h1 id="greeting" class="greeting"></h1>
        <p id="date" class="date"></p>
        <div id="weather" class="weather-container">
            <span id="weather-icon" class="weather-icon"></span>
            <span id="weather-temp" class="weather-temp"></span>
            <span class="sep">•</span>
            <span id="weather-desc" class="weather-desc"></span>
            <span class="sep">•</span>
            <span id="weather-loc" class="weather-loc"></span>
        </div>
        <form id="search-form" class="search-form" method="get" action="https://duckduckgo.com/" autocomplete="off">
            <div class="search-wrap">
                <button type="button" id="engine-toggle" class="engine-toggle" title="Change Search Engine">🦆</button>
                <input id="search-input" spellcheck="false" type="text" name="q" value="" autofocus placeholder="Search the web…" />
            </div>
            <div id="search-history" class="search-history-dropdown"></div>
        </form>
        <div id="bookmarks" class="bookmarks-container">
            <button id="add-bookmark-btn" class="add-bookmark-btn" title="Add Bookmark">+</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
