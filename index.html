<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Start Page">
    <meta name="author" content="Dan Lee">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <title id="title">Start Page</title>
</head>

<body onload="currentTime()">
    <div class="bg"></div>
    <div class="center">
        <div id="time" class="clock"></div>
        <h1 id="greeting" class="greeting"></h1>
        <p id="date" class="date"></p>
        <div id="weather" class="weather-container">
            <span id="weather-icon" class="weather-icon"></span>
            <span id="weather-temp" class="weather-temp"></span>
            <span class="sep">•</span>
            <span id="weather-desc" class="weather-desc"></span>
            <span class="sep">•</span>
            <span id="weather-loc" class="weather-loc"></span>
        </div>
        <div id="calendar-widget" class="calendar-widget list-view">
            <div class="calendar-header">
                <span>Upcoming Events</span>
                <a href="https://outlook.live.com/calendar/0/view/month" target="_blank" class="cal-link" title="Open Outlook Calendar">📅</a>
            </div>
            <div class="events-list" id="events-list"></div>
        </div>
        <form class="search-form" method="get" action="https://duckduckgo.com/" autocomplete="off">
            <div class="search-wrap">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input spellcheck="false" type="text" name="q" value="" autofocus placeholder="Search the web…" />
            </div>
        </form>
        <div id="bookmarks" class="bookmarks-container">
            <button id="add-bookmark-btn" class="add-bookmark-btn" title="Add Bookmark">+</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
